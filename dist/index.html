<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Endgame — Chess practice room</title>
  <meta name="description" content="Practice essential chess endings in English or Chinese. Play either colour against Stockfish, save your progress, and practice offline.">
  <meta name="theme-color" content="#17654f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Endgame"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a href="./" class="brand"><span class="brand-icon"><img src="./pieces/wK.svg" alt=""></span>ENDGAME<span class="brand-divider"></span><span class="brand-caption" data-i18n="room">The practice room</span></a>
    <div class="header-controls"><button id="progress-btn" class="progress-button" aria-label="Your progress"><span id="solved-count">Your progress</span><span id="streak-label"></span></button><button id="language-btn" class="header-button" aria-label="Switch language">中文</button><button id="sound-btn" class="header-button" aria-label="Sound on">♪</button><button id="help-btn" class="header-button" data-label="help">?</button><button id="settings-btn" class="header-button" data-label="settings">⚙</button></div>
  </div></header>
  <div id="update-banner" class="update-banner" hidden><span data-i18n="update"></span><button id="update-btn" data-i18n="reload"></button></div>
  <div class="app-layout">
    <aside class="library" id="library"><div class="library-heading"><span class="eyebrow" data-i18n="practice">YOUR PRACTICE</span><span id="library-total" class="count-tag">24</span></div><h2 data-i18n="libraryTitle">A little practice.<br>A stronger finish.</h2><div class="library-tools"><label class="search-field"><span class="sr-only" data-i18n="searchLessons">Find an endgame</span><input id="lesson-search" type="search" autocomplete="off" placeholder="Find an endgame" data-placeholder="searchLessons"></label><select id="group-filter" data-label="allThemes"></select><div class="filter-row"><select id="level-filter" data-label="allLevels"><option value="all" data-i18n="allLevels"></option><option value="Foundation" data-i18n="foundation"></option><option value="Intermediate" data-i18n="intermediate"></option><option value="Advanced" data-i18n="advanced"></option></select><select id="status-filter" data-label="allProgress"><option value="all" data-i18n="allProgress"></option><option value="todo" data-i18n="toPractice"></option><option value="done" data-i18n="alreadyDone"></option></select></div><button id="shuffle-btn" class="shuffle-button" data-i18n="shuffle" data-label="shuffleHelp">Surprise me</button><div class="library-results"><span id="filter-count" aria-live="polite"></span><button id="clear-filters" class="quiet-button" data-i18n="resetFilters" hidden></button></div></div><div id="exercise-list"></div><div class="library-foot"><span class="tiny-board" aria-hidden="true">▦</span><p data-i18n="saveNote">Settings, results and your current game stay in this browser.</p></div></aside>
    <main class="workspace"><div class="exercise-heading"><div><p id="exercise-category" class="eyebrow"></p><h1 id="exercise-title">The opposition</h1><p id="exercise-description" class="subtitle"></p><p id="setup-label" class="setup-label"></p></div><div class="heading-actions"><span id="difficulty" class="difficulty"></span><a href="#library" class="mobile-lessons" data-i18n="lessons">Endgames</a></div></div>
      <div class="practice-layout"><section class="play-area" aria-label="Chess practice board">
        <div class="player opponent"><div class="player-avatar dark-avatar" id="opponent-avatar"></div><div><strong data-i18n="opponent">Practice opponent</strong><span id="opponent-label"></span></div><span id="opponent-strength" class="player-chip"></span></div>
        <div class="board-stage"><div id="evaluation" class="evaluation" hidden><output id="eval-score" aria-live="off">…</output><div class="eval-track"><div id="eval-fill"></div></div></div><div class="board-frame"><div id="board" class="board" role="group" aria-label="Chessboard"></div><svg id="arrows-overlay" viewBox="0 0 8 8" aria-hidden="true"></svg></div><div id="drag-ghost" aria-hidden="true" hidden></div></div>
        <section id="practice-result" class="practice-result" role="status" aria-live="polite" aria-atomic="true" hidden><span id="result-icon" class="result-icon" aria-hidden="true"></span><div><h2 id="result-title"></h2><p id="result-reason"></p></div><button id="result-retry" class="result-retry" data-i18n="resultRetry">Try again</button></section>
        <div class="player you"><div class="player-avatar" id="you-avatar"></div><div><strong><span data-i18n="you">You</span> <span id="you-colour" class="you-tag"></span></strong><span id="turn-detail"></span></div><span id="turn-indicator" class="turn-indicator"></span></div>
        <div class="board-toolbar"><div><button id="undo-btn" class="tool-button"><span aria-hidden="true">↶</span><span data-i18n="undo">Undo</span></button><button id="reset-btn" class="tool-button"><span aria-hidden="true">⟳</span><span data-i18n="restart">Restart</span></button></div><button id="randomize-btn" class="tool-button" data-label="randomizeHelp"><span aria-hidden="true">⚄</span><span data-i18n="randomize">Randomize</span></button><button id="flip-btn" class="tool-button"><span aria-hidden="true">⇅</span><span data-i18n="flip">Flip board</span></button></div>
        <div class="board-aids"><button id="mark-btn" class="quiet-button" aria-pressed="false" data-i18n="mark">Mark</button><button id="clear-marks-btn" class="quiet-button" data-i18n="clearMarks" hidden>Clear marks</button><button id="quick-dots" class="quiet-button" aria-pressed="true" data-i18n="dots">Show legal-move dots</button><button id="quick-eval" class="quiet-button" aria-pressed="false" data-i18n="evaluation">Show position evaluation</button></div><p id="board-instruction" class="board-instruction" data-i18n="instruction"></p>
      </section>
      <aside class="coach">
        <section class="objective-card"><div class="section-label"><span class="target-icon" aria-hidden="true">◎</span><span data-i18n="objective">THE OBJECTIVE</span></div><h2 id="objective-title"></h2><p id="objective-text"></p><div id="objective-pieces" class="material-display"></div></section>
        <section class="session-card"><div class="status-line"><span id="status-dot" class="status-dot"></span><strong id="game-status"></strong><span id="move-count"></span></div><p id="feedback" class="feedback" aria-live="polite"></p><div id="hint-panel" class="hint-panel" hidden></div><button id="hint-btn" class="hint-button"></button><button id="next-btn" class="next-button" hidden></button>
          <div class="history-section"><div class="moves-heading"><span data-i18n="moves">MOVES</span><span id="history-sides"></span></div><div id="move-history" class="move-history"></div><div id="review-controls" class="review-controls" role="group" aria-label="Review moves"><button id="first-btn" data-label="first">|‹</button><button id="previous-btn" data-label="previous">‹</button><button id="forward-btn" data-label="nextMove">›</button><button id="latest-btn" data-i18n="latest">Latest position</button></div><p id="review-status" class="review-status" aria-live="polite"></p></div>
        </section>
        <details class="principle-card" open><summary><span>◇</span><span data-i18n="idea">The idea to remember</span><span class="chevron">⌄</span></summary><p id="principle-text"></p></details><p id="engine-note" class="engine-note"></p>
      </aside></div>
    </main>
  </div>
  <footer><span data-i18n="footer">Fewer pieces. Deeper understanding.</span><a href="./credits.html" target="_blank" rel="noopener" data-i18n="credits">Credits</a></footer>
  <p id="toast" class="toast" role="status" hidden></p>
  <dialog id="promotion-dialog" aria-labelledby="promotion-title"><h2 id="promotion-title" data-i18n="choosePiece"></h2><p data-i18n="promotionNote"></p><div id="promotion-options"></div><button id="promotion-cancel" class="quiet-button" data-i18n="cancel"></button></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title" data-i18n="settings"></h2><button class="dialog-close" data-close="settings-dialog" data-label="close">×</button></div><div class="dialog-body">
    <label class="setting-row"><span data-i18n="language"></span><select id="language-setting"><option value="en">English</option><option value="zh">中文</option></select></label>
    <label class="setting-row"><span data-i18n="playAs"></span><select id="side-setting"><option value="w" data-i18n="white"></option><option value="b" data-i18n="black"></option></select></label><p class="setting-note" data-i18n="sideNote"></p>
    <div class="strength-setting"><label for="strength-setting"><span data-i18n="strength"></span><output id="strength-value"></output></label><input id="strength-setting" type="range" min="0" max="20" step="1"><div class="range-labels"><span data-i18n="beginner"></span><span data-i18n="strongest"></span></div><p class="setting-note" data-i18n="strengthNote"></p></div>
    <fieldset class="toggle-settings"><legend data-i18n="boardAids"></legend><label><span data-i18n="dots"></span><input id="dots-setting" type="checkbox"></label><label><span data-i18n="coordinates"></span><input id="coordinates-setting" type="checkbox"></label><label><span data-i18n="arrows"></span><input id="arrows-setting" type="checkbox"></label><label><span data-i18n="animation"></span><input id="animation-setting" type="checkbox"></label><label><span data-i18n="sound"></span><input id="sound-setting" type="checkbox"></label><label><span data-i18n="evaluation"></span><input id="evaluation-setting" type="checkbox"></label></fieldset><p class="setting-note" data-i18n="evalNote"></p><p class="storage-note" data-i18n="saveNote"></p>
  </div><div class="dialog-footer"><button class="primary-button" data-close="settings-dialog" data-i18n="close"></button></div></dialog>
  <dialog id="progress-dialog" class="progress-dialog" aria-labelledby="progress-title"><div class="dialog-heading"><h2 id="progress-title" data-i18n="progress"></h2><button class="dialog-close" data-close="progress-dialog" data-label="close">×</button></div><div class="dialog-body"><div id="progress-summary" class="progress-summary"></div><div id="progress-list"></div><p class="setting-note" data-i18n="completionHelp"></p><p class="setting-note" data-i18n="cleanNote"></p><div class="backup-controls"><button id="export-btn" class="secondary-button" data-i18n="export"></button><button id="import-btn" class="secondary-button" data-i18n="import"></button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p class="setting-note" data-i18n="backupNote"></p></div><div class="dialog-footer"><button class="primary-button" data-close="progress-dialog" data-i18n="close"></button></div></dialog>
  <dialog id="import-dialog" aria-labelledby="import-title"><h2 id="import-title" data-i18n="importReady"></h2><p id="import-summary"></p><div class="backup-controls"><button id="confirm-import" class="primary-button" data-i18n="restore"></button><button class="secondary-button" data-close="import-dialog" data-i18n="cancel"></button></div></dialog>
  <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title"><div class="dialog-heading"><h2 id="help-title" data-i18n="help"></h2><button class="dialog-close" data-close="help-dialog" data-label="close">×</button></div><div class="dialog-body"><p data-i18n="helpIntro"></p><ol><li data-i18n="helpPlay"></li><li data-i18n="helpHints"></li><li data-i18n="helpReview"></li><li data-i18n="helpMarks"></li></ol><p class="keyboard-help" data-i18n="helpKeys"></p><h3 data-i18n="offline"></h3><p data-i18n="offlineNote"></p><p id="offline-status" class="setting-note"></p><button id="install-btn" class="primary-button" data-i18n="install" hidden></button><p class="setting-note" data-i18n="installHint"></p></div><div class="dialog-footer"><button class="primary-button" data-close="help-dialog" data-i18n="close"></button></div></dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
